<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Тренер</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #000);
      padding: 16px;
      padding-bottom: 40px;
    }
    h1 { font-size: 22px; margin-bottom: 16px; }
    h2 { font-size: 17px; margin: 20px 0 10px; color: #666; }
    .tabs {
      display: flex; gap: 8px; margin-bottom: 16px;
      position: sticky; top: 0;
      background: var(--tg-theme-bg-color, #fff);
      padding: 8px 0; z-index: 10;
    }
    .tab {
      flex: 1; padding: 10px; border-radius: 10px; text-align: center;
      background: #f0f0f0; cursor: pointer; font-weight: 500;
      user-select: none;
    }
    .tab.active { background: #2481cc; color: #fff; }
    .card {
      background: #f8f8f8; border-radius: 12px; padding: 14px;
      margin-bottom: 10px; border-left: 4px solid #2481cc;
    }
    .card.completed { border-left-color: #4caf50; opacity: 0.7; }
    .card.skipped { border-left-color: #e53935; opacity: 0.7; }
    .card-date { font-size: 13px; color: #888; margin-bottom: 6px; }
    .card-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .card-desc {
      font-size: 14px; color: #555;
      white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .card-meta { font-size: 13px; color: #2481cc; margin-top: 6px; }
    .empty, .loading { text-align: center; color: #999; padding: 40px 0; }
    .chart-container {
      background: #f8f8f8; border-radius: 12px; padding: 16px;
      margin-bottom: 16px;
    }
    canvas { max-height: 240px; }
  </style>
</head>
<body>
  <h1>🏃 AI Тренер</h1>

  <div class="tabs">
    <div class="tab active" data-tab="plan">📅 План</div>
    <div class="tab" data-tab="diary">📖 Дневник</div>
    <div class="tab" data-tab="stats">📊 Графики</div>
  </div>

  <div id="content" class="loading">Загрузка...</div>

  <script>
    "use strict";

    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    let userId = null;
    let authToken = null;
    let currentTab = "plan";
    let charts = [];
    let loadRequestId = 0;

    const content = document.getElementById("content");

    // ---------- Безопасное создание DOM ----------

    function createElement(tag, className, text) {
      const element = document.createElement(tag);

      if (className) {
        element.className = className;
      }

      if (text !== undefined && text !== null) {
        element.textContent = String(text);
      }

      return element;
    }

    function showMessage(message, className = "empty") {
      content.replaceChildren(
        createElement("div", className, message)
      );
    }

    function addTextField(parent, className, value) {
      if (value === null || value === undefined || value === "") {
        return;
      }

      parent.appendChild(
        createElement("div", className, value)
      );
    }

    // ---------- Авторизация ----------

    async function authenticate() {
      const initData = tg.initData;

      if (!initData) {
        throw new Error(
          "Открой приложение через Telegram-бота."
        );
      }

      const response = await fetch("/api/auth/telegram", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          init_data: initData
        })
      });

      if (!response.ok) {
        throw new Error(
          "Не удалось подтвердить авторизацию Telegram."
        );
      }

      const result = await response.json();

      if (
        !result.access_token ||
        !Number.isInteger(Number(result.user_id))
      ) {
        throw new Error(
          "Сервер вернул некорректные данные авторизации."
        );
      }

      authToken = result.access_token;
      userId = Number(result.user_id);
    }

    // ---------- API ----------

    async function apiFetch(url) {
      if (!authToken) {
        throw new Error("Пользователь не авторизован.");
      }

      const response = await fetch(url, {
        headers: {
          "Authorization": `Bearer ${authToken}`
        }
      });

      if (response.status === 401) {
        authToken = null;
        throw new Error(
          "Сессия истекла. Закрой и снова открой приложение через Telegram."
        );
      }

      if (response.status === 403) {
        throw new Error("Нет доступа к этим данным.");
      }

      if (!response.ok) {
        throw new Error(
          `Ошибка сервера: ${response.status}`
        );
      }

      return response;
    }

    // ---------- Графики ----------

    function clearCharts() {
      charts.forEach(chart => chart.destroy());
      charts = [];
    }

    // ---------- Карточки тренировок ----------

    function createTrainingCard(item, isDiary = false) {
      const card = createElement("div", "card");

      if (!isDiary) {
        const allowedStatuses = [
          "completed",
          "skipped",
          "planned"
        ];

        if (allowedStatuses.includes(item.status)) {
          card.classList.add(item.status);
        }
      }

      const structured = (
        item.structured &&
        typeof item.structured === "object"
      ) ? item.structured : {};

      const title = isDiary
        ? structured.type || "Тренировка"
        : item.type || "Тренировка";

      const description = isDiary
        ? item.raw_text
        : item.description;

      const distance = isDiary
        ? structured.distance_km
        : item.distance_km;

      const elevation = isDiary
        ? structured.elevation_m
        : item.elevation_m;

      addTextField(card, "card-date", item.date);
      addTextField(card, "card-title", title);
      addTextField(card, "card-desc", description);

      const distanceValue = Number(distance);

      if (
        distance !== null &&
        distance !== undefined &&
        distance !== "" &&
        Number.isFinite(distanceValue) &&
        distanceValue > 0
      ) {
        addTextField(
          card,
          "card-meta",
          `${distanceValue} км`
        );
      }

      const elevationValue = Number(elevation);

      if (
        elevation !== null &&
        elevation !== undefined &&
        elevation !== "" &&
        Number.isFinite(elevationValue) &&
        elevationValue > 0
      ) {
        addTextField(
          card,
          "card-meta",
          `+${elevationValue} м`
        );
      }

      return card;
    }

    // ---------- Переключение вкладок ----------

    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(item => {
          item.classList.remove("active");
        });

        tab.classList.add("active");
        currentTab = tab.dataset.tab;

        load();
      });
    });

    // ---------- Общая загрузка ----------

    async function load() {
      const requestId = ++loadRequestId;

      clearCharts();
      showMessage("Загрузка...", "loading");

      try {
        if (currentTab === "plan") {
          await loadPlan();
        } else if (currentTab === "diary") {
          await loadDiary();
        } else if (currentTab === "stats") {
          await loadStats();
        }
      } catch (error) {
        console.error("Loading error:", error);

        // Не показываем ошибку устаревшего запроса,
        // если пользователь уже переключил вкладку.
        if (requestId === loadRequestId) {
          showMessage(
            error.message || "Не удалось загрузить данные."
          );
        }
      }
    }

    // ---------- План ----------

    async function loadPlan() {
      const response = await apiFetch(
        `/api/plan/${userId}?days=14`
      );

      const data = await response.json();

      if (!Array.isArray(data)) {
        throw new Error("Некорректный формат плана.");
      }

      if (data.length === 0) {
        showMessage("План тренировок пока пуст.");
        return;
      }

      const fragment = document.createDocumentFragment();

      data.forEach(item => {
        fragment.appendChild(
          createTrainingCard(item)
        );
      });

      content.replaceChildren(fragment);
    }

    // ---------- Дневник ----------

    async function loadDiary() {
      const response = await apiFetch(
        `/api/diary/${userId}?limit=30`
      );

      const data = await response.json();

      if (!Array.isArray(data)) {
        throw new Error("Некорректный формат дневника.");
      }

      if (data.length === 0) {
        showMessage("Дневник тренировок пока пуст.");
        return;
      }

      const fragment = document.createDocumentFragment();

      data.forEach(item => {
        fragment.appendChild(
          createTrainingCard(item, true)
        );
      });

      content.replaceChildren(fragment);
    }

    // ---------- Статистика ----------

    async function loadStats() {
      const response = await apiFetch(
        `/api/stats/${userId}`
      );

      const data = await response.json();

      if (
        !Array.isArray(data.weeks) ||
        !Array.isArray(data.volume) ||
        !Array.isArray(data.elevation) ||
        data.weeks.length !== data.volume.length ||
        data.weeks.length !== data.elevation.length
      ) {
        throw new Error(
          "Некорректный формат статистики."
        );
      }

      if (typeof Chart === "undefined") {
        throw new Error(
          "Не удалось загрузить библиотеку графиков."
        );
      }

      const volumeContainer = createElement(
        "div",
        "chart-container"
      );

      const volumeTitle = createElement(
        "h2",
        "",
        "Объём по неделям (км)"
      );

      const volumeCanvas = document.createElement("canvas");

      volumeContainer.append(
        volumeTitle,
        volumeCanvas
      );

      const elevationContainer = createElement(
        "div",
        "chart-container"
      );

      const elevationTitle = createElement(
        "h2",
        "",
        "Набор высоты по неделям (м)"
      );

      const elevationCanvas = document.createElement("canvas");

      elevationContainer.append(
        elevationTitle,
        elevationCanvas
      );

      content.replaceChildren(
        volumeContainer,
        elevationContainer
      );

      const volumeChart = new Chart(
        volumeCanvas.getContext("2d"),
        {
          type: "bar",
          data: {
            labels: data.weeks,
            datasets: [{
              label: "км",
              data: data.volume,
              backgroundColor: "#2481cc",
              borderRadius: 6
            }]
          },
          options: {
            responsive: true,
            plugins: {
              legend: {
                display: false
              }
            },
            scales: {
              y: {
                beginAtZero: true
              }
            }
          }
        }
      );

      const elevationChart = new Chart(
        elevationCanvas.getContext("2d"),
        {
          type: "bar",
          data: {
            labels: data.weeks,
            datasets: [{
              label: "м",
              data: data.elevation,
              backgroundColor: "#4caf50",
              borderRadius: 6
            }]
          },
          options: {
            responsive: true,
            plugins: {
              legend: {
                display: false
              }
            },
            scales: {
              y: {
                beginAtZero: true
              }
            }
          }
        }
      );

      charts.push(volumeChart, elevationChart);
    }

    // ---------- Запуск ----------

    async function startApp() {
      try {
        showMessage(
          "Проверка авторизации...",
          "loading"
        );

        await authenticate();
        await load();

      } catch (error) {
        console.error(
          "Mini App startup error:",
          error
        );

        authToken = null;

        showMessage(
          error.message || "Ошибка запуска приложения."
        );
      }
    }

    startApp();
  </script>
</body>
</html>
